<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-label="Swap flow: quote, build, sign, send, track"><title>Swap flow: quote, build, sign, send, track</title><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter></defs><rect x="0.5" y="0.5" width="959" height="199" rx="20" fill="#0b0b0c" stroke="#ffffff" stroke-opacity="0.1"/><g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><line x1="96.0" x2="864.0" y1="78" y2="78" stroke="#3a3a3c" stroke-width="1.5"/><circle cx="96.0" cy="78" r="22" fill="#0a84ff"/><text x="96.0" y="83.5" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" >1</text><text x="96.0" y="134" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle" >Quote</text><text x="96.0" y="156" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace">GET /quote</text><circle cx="288.0" cy="78" r="22" fill="#0a84ff"/><text x="288.0" y="83.5" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" >2</text><text x="288.0" y="134" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle" >Build</text><text x="288.0" y="156" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace">POST /swap</text><circle cx="480.0" cy="78" r="22" fill="#1c1c1e" stroke="#f5f5f7" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 3"/><g transform="translate(471.0,69)" fill="none" stroke="#f5f5f7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="16" height="10" rx="2"/><path d="M5 7V5a4 4 0 0 1 8 0v2"/></g><text x="480.0" y="134" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle" >Sign</text><text x="480.0" y="156" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle" >In the user's wallet</text><circle cx="672.0" cy="78" r="22" fill="#0a84ff"/><text x="672.0" y="83.5" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" >3</text><text x="672.0" y="134" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle" >Send</text><text x="672.0" y="156" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace">POST /send-transaction</text><circle cx="864.0" cy="78" r="22" fill="#0a84ff"/><text x="864.0" y="83.5" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" >4</text><text x="864.0" y="134" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle" >Track</text><text x="864.0" y="156" font-size="12" font-weight="400" fill="#a1a1a6" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace">GET /transaction/{sig}</text><text x="480.0" y="30" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="middle" >Raptor never sees a private key. The user's wallet signs.</text></g></svg>