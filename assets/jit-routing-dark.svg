dth="141.4" height="6" rx="3" fill="#0a84ff"/><text x="908" y="206.5" font-size="13" font-weight="600" fill="#4da3ff" text-anchor="end" >62%</text><text x="520" y="232.5" font-size="13" font-weight="500" fill="#f5f5f7" text-anchor="start" >Tessera</text><rect x="628" y="225" width="228" height="6" rx="3" fill="#ffffff" fill-opacity="0.09000000000000001"/><rect x="628" y="225" width="86.6" height="6" rx="3" fill="#0a84ff"/><text x="908" y="232.5" font-size="13" font-weight="600" fill="#4da3ff" text-anchor="end" >38%</text><text x="520" y="258.5" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="start" >SolFi V2</text><rect x="628" y="251" width="228" height="6" rx="3" fill="#ffffff" fill-opacity="0.09000000000000001"/><text x="908" y="258.5" font-size="13" font-weight="400" fill="#8e8e93" text-anchor="end" >—</text><text x="520" y="284.5" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="start" >GoonFi V2</text><rect x="628" y="277" width="228" height="6" rx="3" fill="#ffffff" fill-opacity="0.09000000000000001"/><text x="908" y="284.5" font-size="13" font-weight="400" fill="#8e8e93" text-anchor="end" >—</text><text x="520" y="310.5" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="start" >AlphaQ</text><rect x="628" y="303" width="228" height="6" rx="3" fill="#ffffff" fill-opacity="0.09000000000000001"/><text x="908" y="310.5" font-size="13" font-weight="400" fill="#8e8e93" text-anchor="end" >—</text><text x="520" y="354" font-size="14" font-weight="400" fill="#a1a1a6" text-anchor="start" >The transaction carries candidate pools. Raptor</text><text x="520" y="375" font-size="14" font-weight="400" fill="#a1a1a6" text-anchor="start" >re-prices them on-chain as it lands and splits</text><text x="520" y="396" font-size="14" font-weight="400" fill="#a1a1a6" text-anchor="start" >the order across the best.</text><rect x="352.2" y="448" width="255.5" height="36" rx="18.0" fill="#0a84ff" fill-opacity="0.18"/><text x="480.0" y="471.04" font-size="14" font-weight="600" fill="#4da3ff" text-anchor="middle" >+29.55 USDC on the same swap</text><text x="480.0" y="512" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="middle" >Illustration with example numbers. Real results depend on the order and on how prices move.</text></g></svg>